name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint, migrate, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cermat
          POSTGRES_PASSWORD: cermat
          POSTGRES_DB: cermat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cermat -d cermat"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Tests always run against <name>_test databases they create themselves.
      DATABASE_URL: postgresql+asyncpg://cermat:cermat@localhost:5432/cermat
      DATA_DIR: /tmp/cermat-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Migrate a clean database
        run: alembic upgrade head
      - name: Tests
        run: pytest

  frontend:
    name: Frontend · typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          API_INTERNAL_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Production images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target production -t cermat-api:ci apps/api
      - run: docker build --target production -t cermat-web:ci apps/web
      - name: API refuses insecure production config
        run: |
          if docker run --rm -e RUN_MIGRATIONS=false cermat-api:ci; then
            echo "expected startup to fail with default secrets" && exit 1
          fi
