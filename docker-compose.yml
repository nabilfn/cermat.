# Local development. Hot reload for both apps; migrations run on API start.
#   docker compose up --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cermat
      POSTGRES_USER: cermat
      POSTGRES_PASSWORD: cermat
    ports:
      - "5434:5432"
    volumes:
      - cermat_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cermat -d cermat"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      target: dev
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://cermat:cermat@db:5432/cermat
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      DATA_DIR: /app/data/uploads
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - cermat_uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      target: dev
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  cermat_pg:
  cermat_uploads:
