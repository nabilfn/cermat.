# Single-host production-style stack (e.g. one VM). Only the web port is public;
# the API is reached through the Next.js /api proxy.
#   cp .env.example .env   # set SECRET_KEY, POSTGRES_PASSWORD, OPENAI_API_KEY …
#   docker compose -f docker-compose.prod.yml up --build -d
# For managed PostgreSQL / S3, see docs/deployment.md.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cermat
      POSTGRES_USER: cermat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - cermat_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cermat -d cermat"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      target: production
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://cermat:${POSTGRES_PASSWORD}@db:5432/cermat
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      # Local storage is only acceptable here because of the named volume below.
      ALLOW_LOCAL_STORAGE_IN_PRODUCTION: ${ALLOW_LOCAL_STORAGE_IN_PRODUCTION:-true}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-15}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      - cermat_uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      target: production
      args:
        API_INTERNAL_URL: http://api:8000
        MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-15}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  cermat_pg:
  cermat_uploads:
